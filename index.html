<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>العرصميتر</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#142449">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="العرصميتر">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">

        <!-- Home Screen -->
        <div id="homeScreen" class="home-screen screen visible">
            <div id="challengeBanner" class="challenge-banner"></div>
            <div class="home-middle">
                <div class="home-icon-wrap">
                    <img src="assets/images/logo.png" alt="العرصميتر" class="home-icon">
                </div>
                <p class="home-subtitle">
                    اختبر نسبة العرصنة عندك
                </p>
            </div>
            <div class="home-bottom">
                <div class="name-input-wrap">
                    <input type="text" id="targetNameInput" class="name-input"
                           placeholder="اسم حد يخطر في بالك دلوقتي (اختياري)" maxlength="20">
                </div>
                <button class="btn-primary" onclick="startGame()">
                    ابدأ الاختبار
                </button>
                <p class="hint-text">10 أسئلة · دقيقتين بس</p>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="quiz-screen screen hidden">
            <div class="card">
                <div class="quiz-header">
                    <div class="question-counter">
                        <span>السؤال <span id="qNum">1</span> من 10</span>
                        <span class="badge" id="progressText">0%</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-text" id="questionText"></div>
                </div>

                <div class="options-container" id="optionsContainer"></div>
            </div>
        </div>

        <!-- Analyzing Screen -->
        <div id="analyzingScreen" class="analyzing-screen screen hidden">
            <div class="analyzing-spinner"></div>
            <div class="analyzing-text" id="analyzingText">جاري تحليل درجة عصفرتك...</div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="result-screen screen hidden">
            <div class="card">
                <img src="assets/images/logo.png" alt="العرصميتر" class="result-icon">
                <div class="result-title">نسبة العصفرة</div>

                <div class="gauge-container">
                    <svg class="gauge-svg" viewBox="0 0 250 250">
                        <defs>
                            <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFC93C"/>
                                <stop offset="100%" style="stop-color:#E63950"/>
                            </linearGradient>
                        </defs>
                        <circle class="gauge-bg" cx="125" cy="125" r="110"/>
                        <circle class="gauge-fill" id="gaugeFill" cx="125" cy="125" r="110"/>
                    </svg>
                    <div class="gauge-center">
                        <div class="percentage-number" id="percentageNumber">0%</div>
                        <div class="percentage-label">نسبة العرصنة</div>
                    </div>
                </div>

                <div class="level-icon" id="levelBadge"></div>
                <div class="level-title" id="levelTitle"></div>
                <div class="level-desc" id="levelDesc"></div>
                <div class="random-message" id="randomMessage"></div>

                <div class="percentile-stat" id="percentileStat"></div>

                <div class="category-breakdown">
                    <div class="category-row" id="workRow">
                        <span class="category-label">مع الشغل والمدير</span>
                        <div class="category-bar"><div class="category-bar-fill" id="workBarFill"></div></div>
                        <span class="category-value" id="workBarValue">0%</span>
                    </div>
                    <div class="category-row" id="friendsRow">
                        <span class="category-label">مع الأصحاب</span>
                        <div class="category-bar"><div class="category-bar-fill" id="friendsBarFill"></div></div>
                        <span class="category-value" id="friendsBarValue">0%</span>
                    </div>
                </div>

                <div class="secret-badge" id="secretBadge"></div>

                <div class="challenge-result" id="challengeResult"></div>

                <div class="result-buttons">
                    <button class="btn-secondary btn-share" onclick="shareResult()">
                        شارك نتيجتك
                    </button>
                    <button class="btn-secondary" onclick="compareChallenge()">
                        قارن مع صاحبك
                    </button>
                    <button class="btn-secondary" onclick="downloadBadge()">
                        حمّل شارتك
                    </button>
                    <button class="btn-secondary" onclick="restartGame()">
                        إعادة الاختبار
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>
    <div class="toast" id="toast"></div>

    <script src="js/script.js"></script>
</body>
</html>
